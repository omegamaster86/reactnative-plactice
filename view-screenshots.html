<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アプリのスクリーンショット</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .screenshot-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .screenshot-container h2 {
            margin-top: 0;
            color: #0a7ea4;
        }
        img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <h1>改善されたアプリレイアウト</h1>
    
    <div class="screenshot-container">
        <h2>1. ホーム画面</h2>
        <img src="screenshot-home.png" alt="ホーム画面" />
    </div>
    
    <div class="screenshot-container">
        <h2>2. タスク画面</h2>
        <img src="screenshot-todos.png" alt="タスク画面" />
    </div>
    
    <div class="screenshot-container">
        <h2>3. 探索画面</h2>
        <img src="screenshot-explore.png" alt="探索画面" />
    </div>
</body>
</html>
